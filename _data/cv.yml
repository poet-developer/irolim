    Research and System Development:
      - bullet: |
          **Co-Reading — Research Lead and Developer**
            2024–2026. Led an end-to-end master's research project investigating human–AI co-reading of Korean modern poetry, spanning human-annotated dataset construction, emotion classification modeling, emotion-to-color mapping, and interactive system design. Developed Co-Reading as an interpretive framework in which computational representations support, rather than replace, human interpretation; presented successive stages of the research at national and international conferences.

      - bullet: |
          **KPoEM Interface — Sole Author and Developer**
            2026\. Designed and developed the interactive web system implementing the Co-Reading research framework. Integrated close reading, distant reading, and human–AI Co-Reading with emotion classification, color visualization, and interpretive interaction, translating the project's dataset, model, and emotion-to-color mapping into an interactive environment for poetry interpretation.
            [Website](https://poet-developer.github.io/KPoEMInterface/)

      - bullet: |
          **AI Cultural Heritage Docent Web Prototype — Full Stack Developer**
            2025–Present. Collaborative research with Songyi Jeong and Baro Kim. Developed a prototype combining cultural heritage knowledge and generative AI to produce explanations responsive to visitors' backgrounds and languages; presented at DH2026.

      - bullet: |
          **BKKSG — Creator and Full Stack Developer**
            2023\. Independently led product planning, design, and full-stack development of an artwork portfolio platform.
            [Website](https://bkksg.com)

    Datasets and Models:
      - bullet: |
          **Co-Reading Module: Emotion-to-Color Transformation Algorithm**
            2026\. Sole author and developer of the emotion-to-color transformation module for human–AI Co-Reading.
            [Code](https://github.com/poet-developer/Co-Reading)

      - bullet: |
          **KPoEM (Korean Poetry Emotion Mapping) Dataset — Producer**
            2025\. First author and producer of a human-annotated emotion dataset for Korean modern poetry, developed with Haein Ji, Seul Koo, J. Yun, S.-yi Jung, and Byungjun Kim at AKS-DHLAB.
            [Hugging Face DOI](https://doi.org/10.57967/hf/6303) · [Zenodo](https://zenodo.org/records/15598092)

      - bullet: |
          **KCoEM (Korean Color Emotion Mapping) Dataset — Producer**
            2025\. Sole producer of a Korean color–emotion mapping dataset.
            [DOI](https://doi.org/10.5281/zenodo.17797747) · [Dataset record](https://zenodo.org/records/17797748)

      - bullet: |
          **KPoEM Emotion Classification Model — Producer**
            2025\. First author and producer of an emotion classification model for Korean modern poetry, developed with Haein Ji and Byungjun Kim at AKS-DHLAB.
            [Hugging Face DOI](https://doi.org/10.57967/hf/6301)

      - bullet: |
          **KNoTE (Korean Novel TEI Encoded) Dataset v4 — Annotator**
            2026\. Annotator for a TEI-encoded Korean novel dataset.
            [DOI](https://doi.org/10.5281/zenodo.19813475)

