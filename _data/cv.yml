    Datasets and Models:
      - bullet: |
          **Co-Reading Module: Emotion-to-Color Transformation Algorithm**
            2026. Sole author and developer of the emotion-to-color transformation module for human–AI Co-Reading.
            [Code](https://github.com/poet-developer/Co-Reading)

      - bullet: |
          **KPoEM (Korean Poetry Emotion Mapping) Dataset — Producer**
            2025. First author and producer of a human-annotated emotion dataset for Korean modern poetry, developed with Haein Ji, Seul Koo, J. Yun, S.-yi Jung, and Byungjun Kim at AKS-DHLAB.
            [Hugging Face DOI](https://doi.org/10.57967/hf/6303) · [Zenodo](https://zenodo.org/records/15598092)

      - bullet: |
          **KCoEM (Korean Color Emotion Mapping) Dataset — Producer**
            2025. Sole producer of a Korean color–emotion mapping dataset.
            [DOI](https://doi.org/10.5281/zenodo.17797747) · [Dataset record](https://zenodo.org/records/17797748)

      - bullet: |
          **KPoEM Emotion Classification Model — Producer**
            2025. First author and producer of an emotion classification model for Korean modern poetry, developed with Haein Ji and Byungjun Kim at AKS-DHLAB.
            [Hugging Face DOI](https://doi.org/10.57967/hf/6301)

      - bullet: |
          **KNoTE (Korean Novel TEI Encoded) Dataset v4 — Annotator**
            2026. Annotator for a TEI-encoded Korean novel dataset.
            [DOI](https://doi.org/10.5281/zenodo.19813475)

