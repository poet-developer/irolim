    Research Projects:
      - bullet: |
          **Multilingual and Multi-layered Cultural Heritage Description Platform for AI Smart Docents**
            2025-09 – 2026-02. Research assistant on a platform for generating cultural heritage descriptions focused on Joseon-period Buddhist paintings.

      - bullet: |
          **Advanced NLP and LLM-Based Digital Korean Studies Research and Education Methodology**
            2025-03 – 2025-08. Research assistant on computational methods for digital Korean studies and education.

      - bullet: |
          **Networked Educational Model in Digital Humanities**
            2025-03 – 2025-06. External participating researcher and annotator on a National Research Foundation of Korea project. [Dataset](https://zenodo.org/records/16616347)

      - bullet: |
          **Ontology and LOD System for Inmulgo (人物考)**
            2024-09 – 2025-02. Research assistant on ontology design and linked open data system construction.

      - bullet: |
          **Historical Document Data Design and Educational Content**
            2024-03 – 2024-08. Research assistant on prior model analysis and educational content for historical document data design.

