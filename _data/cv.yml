  label: Computational Media Researcher, Poet, and Developer
  location: Republic of Korea
  image: ""
  summary: >-
    I design interactive systems as environments in which people interpret cultural works and make meaning with artificial intelligence.
    My research connects human–computer interaction, media aesthetics, AI, art, and digital humanities, examining how datasets, models, and interfaces shape interpretation.

